name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not only the feature you imagine.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ReadytoWork to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including a workaround you use today, if any.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps ReadytoWork dependency-free
        - label: This works on Windows 10 and 11
