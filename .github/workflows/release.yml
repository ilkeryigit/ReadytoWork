name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build executable and installer
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm ReadytoWork.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found - is Inno Setup 6 installed?" }
          Write-Output "Using $iscc"
          & $iscc installer.iss

      - name: Verify artifacts
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist\ReadytoWork.exe")) { throw "Executable missing" }
          $setup = Get-ChildItem "dist\ReadytoWork-Setup-*.exe"
          if (-not $setup) { throw "Installer missing" }

      - name: Upload installer and executable
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReadytoWork-Setup-*.exe
            dist/ReadytoWork.exe
          draft: true
          generate_release_notes: true
          body: |
            ## ReadytoWork 1.0.0

            A Windows tray launcher for your programs, folders, documents and web
            addresses.

            **Download the installer:** `ReadytoWork-Setup-1.0.0.exe`

            The installer is not code-signed, so Windows SmartScreen may warn on
            first run. Choose *More info → Run anyway*.

            ### Highlights

            - Tray menu with one-click *Open all*
            - Five interface languages: English, Türkçe, 中文, Deutsch, Italiano
            - Settings stored in `%APPDATA%\ReadytoWork\config.json`, written atomically
            - Programs, folders, documents and web addresses
            - Single instance: launching twice does nothing
            - Native uninstaller removes the application and its settings

            ### Verify the download (optional)

            ```
            Get-FileHash .\ReadytoWork-Setup-1.0.0.exe -Algorithm SHA256
            ```

            Full changelog: [CHANGELOG.md](https://github.com/ilkeryigit/ReadytoWork/blob/main/CHANGELOG.md)
